<table>
    <thead>
        <th>ID</th>
        <th>Version</th>
        <th>Food ID</th>
        <th>Category ID</th>
    </thead>
    <tbody>
        @for(item of itemsShow(); track item.id){
            <tr>
                <td>{{item.id}}</td>
                <td>{{item.version}}</td>
                <td>{{item.foodId}}</td>
                <td>{{item.categoryId}}</td>
                <td>
                    <button (click)="deleteEvent($index)">Izbrisi</button>
                    <button (click)="editEvent($index)">Izmeni</button>
                </td>
            </tr>
        }
    </tbody>
</table>
