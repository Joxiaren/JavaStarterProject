services:
  db:
    container_name: database
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    #Limits for testing
    deploy:
      resources:
        limits:
          memory: 1G  
  
  pgadmin:
    container_name: pgadmin4_container
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      #PGADMIN_CONFIG_SCRIPT_NAME: "'/pgadmin'"
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL : 30
    healthcheck:
      #test: ["CMD", "wget", "-O", "-", "http://localhost:80/misc/ping"]
      test: ["CMD-SHELL", "curl -f http://localhost:80/misc/ping || exit 1 > /dev/null 2>&1"]
      #test: ["CMD-SHELL", "timeout 1s bash -c ':> /dev/tcp/localhost/80' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    #Limits for testing
    deploy:
      resources:
        limits:
          memory: 1G  
    depends_on:
      db:
        condition: service_healthy        

  backend:
    container_name: backend
    build: 
      context: ./backend/
      dockerfile: Dockerfile
    env_file: 
        - path: ./backend/.env
          required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/food"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    #Limits for testing
    deploy:
      resources:
        limits:
          memory: 1G     
    depends_on:
      db:
        condition: service_healthy        
     
  nginx:
    container_name: nginx
    restart: always
    image: nginx:latest
    ports:
      - 80:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    healthcheck:
      #test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    #Limits for testing
    deploy:
      resources:
        limits:
          memory: 1G  
    depends_on:
      - db   
      - pgadmin
      - backend
            

volumes:
  db_data:      