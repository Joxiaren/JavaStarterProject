events{
    worker_connections 1024;
}


http{
    autoindex_localtime on;
    server_tokens off;
    charset  utf-8;

    log_format main_format escape=json '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" "$http_x_forwarded_for"'
                            'body: "$request_body"';
    access_log  /var/log/nginx/access.log main_format;
   
    server {
        listen 80;
        server_name localhost;
        location /api/{
            proxy_pass http://backend:8080;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Forwarded-Host $server_name;
            access_log  /var/log/nginx/backend.access.log  main_format;
        }
        location /pgadmin/{
            proxy_pass http://pgadmin:80;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Forwarded-Host $server_name;
			proxy_set_header X-Script-Name /pgadmin;
			proxy_set_header X-Scheme $scheme;
			proxy_redirect off;
        }
        location /{
            proxy_pass http://frontend:8080;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Forwarded-Host $server_name;
            access_log  /var/log/nginx/frontend.access.log main_format;
        }
        location /db/{
            proxy_pass http://db:5432;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Forwarded-Host $server_name;
        }
    }
    
}


    