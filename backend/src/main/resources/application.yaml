spring:
  application:
    name: Starter
  datasource:
    #url: jdbc:postgresql://localhost:5434/starter
    url: jdbc:mysql://localhost:9911/starter
    #username: postgres
    username: root
    #password: root
  jackson:
    mapper:
      sort-properties-alphabetically: false
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        #dialect: org.hibernate.dialect.PostgreSQLDialect
        dialect: org.hibernate.dialect.MySQLDialect 
